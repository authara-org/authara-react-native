services:
  postgres:
    image: postgres:16.2
    environment:
      POSTGRES_DB: authara
      POSTGRES_USER: authara
      POSTGRES_PASSWORD: authara
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authara -d authara"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - playground-postgres:/var/lib/postgresql/data

  migrations:
    image: ghcr.io/authara-org/authara-migrations:${AUTHARA_MIGRATIONS_VERSION:-v0.4.0}
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: authara
      POSTGRESQL_USERNAME: authara
      POSTGRESQL_PASSWORD: authara
      POSTGRESQL_SSL_MODE: disable
    command: ["up", "-env=default", "-config=/migrations/dbconfig.yaml"]
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - playground-redis:/data

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "${AUTHARA_MAILPIT_SMTP_PORT:-1026}:1025"
      - "${AUTHARA_MAILPIT_HTTP_PORT:-8026}:8025"

  authara:
    image: ghcr.io/authara-org/authara-core:${AUTHARA_CORE_VERSION:-v0.26.1}
    environment:
      APP_ENV: dev
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: authara
      POSTGRESQL_USERNAME: authara
      POSTGRESQL_PASSWORD: authara
      POSTGRESQL_SSL_MODE: disable
      PUBLIC_URL: ${AUTHARA_PUBLIC_URL:-https://playground.authara.org}
      AUTHARA_JWT_ISSUER: authara-react-native-playground
      AUTHARA_JWT_ACTIVE_KEY_ID: playground
      AUTHARA_JWT_PRIVATE_KEYS: ${AUTHARA_JWT_PRIVATE_KEYS:?Set AUTHARA_JWT_PRIVATE_KEYS to playground:<base64-key> in the React Native .env}
      AUTHARA_CHALLENGE_ENABLED: "true"
      AUTHARA_CHALLENGE_VERIFICATION_CODE_ACTIVE_KEY_ID: playground-challenge
      AUTHARA_CHALLENGE_VERIFICATION_CODE_KEYS: ${AUTHARA_CHALLENGE_VERIFICATION_CODE_KEYS:?Set AUTHARA_CHALLENGE_VERIFICATION_CODE_KEYS to playground-challenge:<base64-key> in the React Native .env}
      AUTHARA_CACHE_PROVIDER: redis
      AUTHARA_REDIS_HOST: redis
      AUTHARA_REDIS_PORT: 6379
      AUTHARA_ACCESS_TOKEN_REVOCATION_MODE: immediate
      AUTHARA_ORG_MODE: ${AUTHARA_ORG_MODE:-multi}
      AUTHARA_EMAIL_PROVIDER: smtp
      AUTHARA_EMAIL_FROM: Authara Playground <no-reply@authara.org>
      AUTHARA_EMAIL_SMTP_HOST: mailpit
      AUTHARA_EMAIL_SMTP_PORT: 1025
      AUTHARA_EMAIL_SMTP_TLS: "false"
      AUTHARA_OAUTH_PROVIDERS: ${AUTHARA_OAUTH_PROVIDERS:-}
      AUTHARA_OAUTH_GOOGLE_CLIENT_ID: ${AUTHARA_OAUTH_GOOGLE_CLIENT_ID:-}
      AUTHARA_OAUTH_GOOGLE_CLIENT_SECRET: ${AUTHARA_OAUTH_GOOGLE_CLIENT_SECRET:-}
      AUTHARA_OAUTH_MICROSOFT_CLIENT_ID: ${AUTHARA_OAUTH_MICROSOFT_CLIENT_ID:-}
      AUTHARA_OAUTH_MICROSOFT_TENANT_ID: ${AUTHARA_OAUTH_MICROSOFT_TENANT_ID:-common}
      AUTHARA_OAUTH_APPLE_CLIENT_ID: ${AUTHARA_OAUTH_APPLE_IOS_CLIENT_ID:-${AUTHARA_OAUTH_APPLE_CLIENT_ID:-}}
      AUTHARA_OAUTH_APPLE_TEAM_ID: ${AUTHARA_OAUTH_APPLE_TEAM_ID:-}
      AUTHARA_OAUTH_APPLE_KEY_ID: ${AUTHARA_OAUTH_APPLE_KEY_ID:-}
      AUTHARA_OAUTH_APPLE_PRIVATE_KEY_BASE64: ${AUTHARA_OAUTH_APPLE_PRIVATE_KEY_BASE64:-}
      AUTHARA_OAUTH_APPLE_TOKEN_ACTIVE_KEY_ID: ${AUTHARA_OAUTH_APPLE_TOKEN_ACTIVE_KEY_ID:-}
      AUTHARA_OAUTH_APPLE_TOKEN_KEYS: ${AUTHARA_OAUTH_APPLE_TOKEN_KEYS:-}
    healthcheck:
      test: ["CMD", "/app/authara", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  app:
    image: nginx:1.29-alpine

  gateway:
    image: ghcr.io/authara-org/authara-gateway:v1.2.1
    ports:
      - "${AUTHARA_GATEWAY_PORT:-3002}:3000"
    environment:
      GATEWAY_BIND: :3000
      AUTHARA_UPSTREAM: authara:8080
      APP_UPSTREAM: app:80
    depends_on:
      authara:
        condition: service_healthy
      app:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in the React Native .env}
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped

volumes:
  playground-postgres:
  playground-redis:
